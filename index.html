<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEHL · Geotechnical Earthquake and GeoHazards Lab, KAIST</title>
<meta name="description" content="Geotechnical Earthquake and GeoHazards Lab (GEHL), Department of Civil and Environmental Engineering, KAIST. Research, people, publications, teaching, and news.">
<link rel="icon" href="img/favicon.png" type="image/png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one 1120px column under a sticky bar; Arial throughout (display = bold Arial, labels = small-caps-style tracked Arial); cards for Research and People, dividers elsewhere; the seismogram in the hero is the only flourish. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#121B2B; --muted:#1C2430; --line:#DDDDDD; --line-strong:#BFBFBF;
  --heading:#002060; --brand:#0D4A9A; --brand-ink:#0A3470; --soft:#E6EEF9; --accent:#C8322B; --trace:#1D3F72; --grid:#E3E8F0;
  --display:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --body:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --mono:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --radius:4px; --shadow:0 10px 30px rgba(10,30,60,.14);
  --ill-ink:#1A2B45; --ill-line:#8794A8; --ill-soil:#E9E1CF; --ill-soil2:#D9CDB0; --ill-rock:#C7CDD6; --ill-water:#D6E6F7; --ill-accent:#C8322B;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--heading)}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
[hidden]{display:none!important}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);box-shadow:0 2px 10px rgba(0,32,96,.10)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;flex:0 0 auto;min-width:0}
.brand:hover{text-decoration:none}
.brand .logo{display:block;height:44px;width:auto;max-width:min(380px,64vw)}
nav.main{margin-left:auto;display:flex;gap:4px}
nav.main a{display:block;padding:8px 10px;border-radius:var(--radius);color:var(--heading);font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
nav.main a:hover{background:var(--soft);text-decoration:none}
nav.main a[aria-current="page"]{color:var(--heading);box-shadow:inset 0 -2px 0 var(--heading);border-radius:0}
.menu-btn{display:none;margin-left:auto;padding:8px;border:1px solid var(--line);border-radius:var(--radius)}
.menu-btn svg{display:block}
@media (max-width:980px){
  .brand .logo{height:34px}
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);flex-direction:column;padding:8px max(16px,env(safe-area-inset-left,0px)) 12px;gap:0;box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:11px 8px;border-bottom:1px solid var(--line)}
  nav.main a[aria-current="page"]{box-shadow:none;background:var(--soft)}
}

/* Sections */
main{display:block}
.pband + .wrap{padding-top:32px}
.section{padding-block:56px}
.section + .section{border-top:1px solid var(--line)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.section-head h2{font-size:28px}
.section-head .more{font-size:14px;white-space:nowrap}
.lede{font-size:18px;line-height:1.5;color:var(--fg)}
.lede.full{max-width:none}
.prose{}
.prose p + p{margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid #B5B5B5;border-radius:var(--radius);color:#333;font-weight:500;font-size:14.5px;line-height:1.2;background:var(--surface)}
.btn:hover{background:#F0F0F0;border-color:#8C8C8C;text-decoration:none}
.btn.primary{background:var(--surface);color:#333;border-color:#B5B5B5}
.btn.primary:hover{background:#F0F0F0;border-color:#8C8C8C}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.btn.primary.danger{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--line-strong);border-radius:999px;color:var(--muted);white-space:nowrap}
.chip .kem,.filters .kem{font-size:13px;margin-right:5px;letter-spacing:0;line-height:1}
.chip.kind-award{border-color:var(--accent);color:var(--accent)}
.chip.kind-publication,.chip.kind-talk{border-color:var(--brand);color:var(--brand)}

/* Page band: every page opens with its title, sized like the lab name, over a faint banner image */
.pband{position:relative;background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden}
.pband::before{content:"";position:absolute;inset:0;background-image:var(--banner);background-size:cover;background-position:center;opacity:.16;pointer-events:none}
.pband .wrap{position:relative;padding-block:64px 44px}
.pband .page-title{font-size:clamp(26px,7vw,40px);font-weight:700;letter-spacing:-.012em;line-height:1.1;margin:0;text-align:center;white-space:normal;color:var(--heading)}
:root.title-fit .pband .page-title{font-size:var(--title-size);white-space:nowrap}
.pband .row{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:14px;min-height:24px}
.pband .tag{font-family:var(--display);font-weight:400;font-size:15px;color:var(--heading);letter-spacing:.34em;text-indent:.34em;white-space:nowrap}
.pband .row .rule{flex:0 1 120px;height:1px;background:var(--heading);opacity:.45}
.pband .founded{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:12px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
@media (max-width:600px){ .pband .tag{font-size:12.5px;letter-spacing:.22em;text-indent:.22em} .pband .row .rule{flex-basis:40px} }
.hero{padding-block:30px 8px}
.hero .intro{margin-top:0;max-width:none;font-size:17px;line-height:1.6;color:var(--fg)}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

/* Group photo (home) and blossom gallery */
.home-top{padding-block:28px 48px}
.home-top .section-head{margin-bottom:18px}
.home-card{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(500px,1fr);overflow:hidden;min-height:470px}
.photo-pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.photo-pane .ph{position:relative;flex:1;min-height:300px;background:var(--soft);display:grid;place-items:center}
.photo-pane .ph.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 75%}
.photo-pane .ph .empty-ph{text-align:center;color:var(--muted);padding:24px;font-size:15px;max-width:40ch}
.photo-pane .ph .empty-ph b{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:var(--fg);margin-bottom:6px}
.photo-pane .cap{padding:14px 22px;border-top:1px solid var(--line);font-family:var(--display);font-weight:400;font-size:17px;color:var(--heading)}
.photo-pane .cap b{font-weight:400}
.intro-pane{padding:34px 34px 30px;display:flex;flex-direction:column;min-width:0}
.intro-pane .intro{font-size:17.5px;line-height:1.75;color:var(--fg)}
.intro-pane .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:26px}
@media (max-width:1000px){ .home-card{grid-template-columns:1fr;min-height:0} .photo-pane{border-right:0;border-bottom:1px solid var(--line)} .photo-pane .ph.has{flex:none;aspect-ratio:4/3;min-height:0} }
.gp-card{overflow:hidden;width:100%;margin:0}
.gp-card .ph{position:relative;max-width:100%;background:var(--soft);display:grid;place-items:center}
.gp-card .ph:not(.has){aspect-ratio:16/7}
.gp-card .ph img{display:block;width:100%;height:auto}
.gp-card .ph .empty-ph{text-align:center;color:var(--muted);padding:24px;font-size:15px;max-width:40ch}
.gp-card .ph .empty-ph b{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:var(--fg);margin-bottom:6px}
.gp-card .cap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 22px}
.gp-card .cap .t{font-size:15px}
.gp-card .cap .t b{font-family:var(--display);font-weight:700;font-size:17px;display:block;margin-bottom:0;color:var(--heading)}
.blossoms{display:grid;gap:28px;justify-items:stretch}
.blossom{overflow:hidden;width:70%;margin:0 auto}
@media (max-width:700px){ .blossom{width:100%} }
.blossom .ph{max-width:100%;background:var(--soft);position:relative;display:grid;place-items:center}
.blossom .ph:not(.has){aspect-ratio:16/8}
.blossom .ph img{display:block;width:100%;height:auto}
.blossom .ph .empty-ph{color:var(--muted);font-size:14.5px;text-align:center;padding:20px}
.blossom .cap{padding:14px 22px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.blossom .cap .y{font-family:var(--display);font-weight:700;font-size:22px;color:var(--heading)}
.blossom .cap .t{color:var(--muted);font-size:14.5px}
@media (max-width:600px){ .gp-card .ph:not(.has){aspect-ratio:4/3} .blossom .ph:not(.has){aspect-ratio:4/3} }

/* Pillars (conceptual, picture-first) */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.pillar{display:grid;gap:8px;color:inherit;min-width:0;align-content:start}
.pillar:hover{text-decoration:none}
.pillar .ill{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;aspect-ratio:3/2;max-width:100%}
.pillar .ill svg{display:block;width:100%;height:100%}
.pillar .ill img{display:block;width:100%;height:100%;object-fit:cover}
.pillar .ill.photo{border:0}
.pillar:hover .ill{border-color:var(--brand)}
.pillar h3{font-size:16.5px;margin-top:4px}
.pillar:hover h3{color:var(--brand)}
.pillar p{font-size:13.5px;color:var(--fg);line-height:1.45}
@media (max-width:900px){ .pillars{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .pillars{grid-template-columns:1fr} }
.methods{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.methods span{padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);font-size:14px;background:var(--surface)}

/* News and Gallery: card grid + photo popup */
.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 28px;margin-top:6px}
@media (max-width:760px){ .news-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px} }
@media (max-width:420px){ .news-grid{grid-template-columns:1fr} }
.ncard{display:grid;gap:10px;align-content:start;text-align:left;color:inherit;min-width:0;font:inherit}
.ncard .ph{position:relative;display:block;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.ncard .ph img{display:block;width:100%;height:100%;object-fit:contain;position:relative;z-index:1;transition:transform .25s ease}   /* the whole photo ... */
.ncard .ph img.bg{position:absolute;inset:0;z-index:0;object-fit:cover;filter:blur(18px) brightness(.92) saturate(1.1);transform:scale(1.2)}   /* ... over a blurred copy that fills the 4:3 box */
.ncard:hover .ph img{transform:scale(1.03)}
.ncard:hover .ph img.bg{transform:scale(1.2)}
.ncard .ph-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;opacity:.8}
.ncard .cnt{position:absolute;z-index:2;right:8px;bottom:8px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(18,27,43,.72);color:#fff}
.ncard .t{font-family:var(--display);font-weight:700;font-size:16.5px;line-height:1.35;color:var(--heading)}
.ncard:hover .t{color:var(--brand)}
.ncard .m{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ncard .m .d{font-size:13.5px;color:var(--muted)}
.modal .dlg.news{grid-template-columns:1fr;gap:16px;padding:22px 24px 26px;width:fit-content;min-width:min(440px,100%);max-width:min(860px,100%)}   /* the box follows the photo's size */
.modal .dlg.news .nm-body,.modal .dlg.news .strip{width:0;min-width:100%}
.modal .dlg.news .close{z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.3)}   /* it now sits over the photo */   /* text and thumbnails take the photo's width instead of setting it */
.modal .dlg.news .car{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.modal .dlg.news .car img{display:block;width:auto;max-width:100%;height:auto;max-height:min(62vh,560px);margin:0 auto;object-fit:contain}
.modal .dlg.news .car .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);color:var(--heading);font-size:28px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.modal .dlg.news .car .nav:hover{background:#fff}
.modal .dlg.news .car .prev{left:12px} .modal .dlg.news .car .next{right:12px}
.modal .dlg.news .car .pos{position:absolute;right:12px;bottom:10px;font-size:12.5px;padding:2px 9px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.modal .dlg.news .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.modal .dlg.news .strip .th{flex:0 0 auto;width:72px;height:54px;border-radius:6px;overflow:hidden;border:2px solid transparent;opacity:.65}
.modal .dlg.news .strip .th img{width:100%;height:100%;object-fit:cover;display:block}
.modal .dlg.news .strip .th.on{border-color:var(--heading);opacity:1}
.modal .dlg.news .nm-body .m{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.modal .dlg.news .nm-body .who{color:var(--muted)}
.modal .dlg.news h2{font-size:24px;margin-top:8px}
.modal .dlg.news .b{margin-top:12px;font-size:15.5px;line-height:1.6;white-space:pre-line}
@media (max-width:640px){ .modal .dlg.news{padding:16px} .modal .dlg.news h2{font-size:20px} }

/* News list */
.news-list{display:grid;gap:0}
.news-item{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.news-item:last-child{border-bottom:1px solid var(--line)}
.news-item .d{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.news-item .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.news-item h3{font-size:18px}
.news-item .who{font-size:13.5px;color:var(--muted)}
.news-item .b{margin-top:6px;color:var(--fg);font-size:15px}
.news-item .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.news-item .imgs img{width:200px;max-width:100%;height:140px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line)}
@media (max-width:600px){ .news-item{grid-template-columns:1fr;gap:6px} }
.news-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.news-card{padding:20px 22px;display:flex;flex-direction:column;gap:8px;min-width:0;color:inherit}
.news-card:hover{text-decoration:none}
.news-card .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.news-card h3{font-size:18px}
.news-card:hover h3{color:var(--brand)}
.news-card p{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.news-card img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media (max-width:980px){ .news-cards{grid-template-columns:1fr} }
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs button{padding:10px 12px;font-size:14.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.filters button{padding:5px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;min-width:0;flex:1 1 200px}
.empty{padding:28px 0;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* Cards (Research, People, home news) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(10,30,60,.04),0 10px 28px rgba(10,30,60,.06)}
.page-sub{color:var(--muted);font-size:16px;margin-top:28px;margin-bottom:22px}

/* People (SEED-style grid) */
.pi-block{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:40px;align-items:start;padding:28px;margin-bottom:28px}
.pi-block .avatar{width:100%;height:auto;aspect-ratio:1/1;border-radius:28px}
.pi-block h3{font-size:26px}
.pi-block .role{color:var(--muted);margin-top:4px}
.pi-block .bio{margin-top:14px;font-size:15.5px}
.pi-block .links{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:14px}
@media (max-width:700px){ .pi-block{grid-template-columns:1fr;padding:20px} .pi-block .avatar{width:100%;max-width:320px;height:auto} }
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.pills button{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 12px;border-radius:999px;background:#EFEFEF;color:var(--fg);font-size:13.5px;font-weight:500}
.pills button .c{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface);color:var(--muted)}
.pills button[aria-pressed="true"]{background:#4A4F57;color:#fff}
.pills button[aria-pressed="true"] .c{background:rgba(255,255,255,.22);color:#fff}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:760px){ .people{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:460px){ .people{grid-template-columns:1fr} }
.pcard{display:grid;gap:10px;padding:22px;align-content:start;color:inherit;text-align:left;min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.pcard:hover{text-decoration:none;transform:translateY(-2px)}
.pcard .avatar{width:100%;max-width:260px;aspect-ratio:4/5;height:auto;border-radius:28px;justify-self:center;margin:4px 0 6px}
.pcard .fav{position:relative;overflow:hidden;background:var(--soft)}
.pcard .fav img{position:absolute;display:block;width:auto;max-width:none}
.pcard .rpill{justify-self:start;margin-top:2px}
.pcard .nm{font-family:var(--display);font-weight:700;font-size:22px;color:var(--heading)}
.pcard:hover .nm{color:var(--brand)}
.pcard .in{font-size:15.5px;color:var(--muted);line-height:1.45}
.rpill .em{font-size:13px;margin-right:6px;letter-spacing:0;line-height:1;display:inline-block}
.legend-em{font-size:14px;color:var(--fg);margin:0 0 10px}
.rpill{display:inline-flex;align-items:center;justify-self:start;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:0 10px;height:22px;border-radius:999px;border:1px solid #B8C2CF;line-height:1;color:#465261;background:#EEF1F5}
.avatar{display:block;border-radius:var(--radius);object-fit:cover;background:var(--soft);border:1px solid var(--line)}

.pub .au{color:var(--muted)}
.pub .au .member{color:var(--fg);text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px;text-decoration-thickness:1.5px}
.pub .ti{font-weight:500;margin-top:2px}

.legend{font-size:13px;color:var(--muted);margin-top:14px}

.legend .member{text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:3px;color:var(--fg)}

/* Research (card per area) */
.rcards{display:grid;gap:24px}
.rcard{padding:32px 36px}
.rcard h3{font-size:26px;margin-top:6px}

.rcard .prose p{font-size:15.5px;line-height:1.6}
.rcard .sub{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.rcard .chips{display:flex;flex-wrap:wrap;gap:8px}
.rcard .chips span{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--fg)}
.rcard figure{margin:20px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.rcard figure img{display:block;width:100%;max-height:420px;object-fit:contain;background:#fff}
.rcard figcaption{font-size:12.5px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.rcard .sel{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.rcard .sel li{font-size:14px;color:var(--muted);padding-left:14px;position:relative}
.rcard .sel li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
.rcard .sel li a{color:var(--fg)}

.framework{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:10px;margin:22px 0 0}
.framework .step{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;background:var(--surface);min-width:0}
.framework .step .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.framework .step .t{font-family:var(--display);font-weight:700;font-size:17px;margin-top:4px;color:var(--heading)}
.framework .step .s{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.framework .arrow{color:var(--muted);font-size:22px;align-self:center}
.framework .loop{grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.framework .loop::before,.framework .loop::after{content:"";flex:1;border-top:1px dashed var(--line-strong)}

.interests{columns:2;column-gap:40px;margin:0;padding-left:18px;font-size:15px}
.interests li{break-inside:avoid;margin:4px 0}

table.projects{width:100%;border-collapse:collapse;font-size:14.5px;table-layout:fixed}
table.projects .c-title{width:54%} table.projects .c-sponsor{width:22%} table.projects .c-period{width:13%} table.projects .c-role{width:11%}
table.projects th{text-align:left;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--line-strong)}
table.projects td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.projects td.per{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto}
@media (max-width:700px){ table.projects{min-width:620px} }

.rcard .quote{margin-top:10px;font-size:17px;font-style:italic;color:var(--brand)}
.cycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.cstep{border:1px solid var(--line-strong);border-radius:10px;padding:14px 16px;background:var(--surface);min-width:0}
.cstep .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cstep .t{font-family:var(--display);font-weight:700;font-size:16px;margin-top:4px;color:var(--heading)}
.cstep .s{font-size:13.5px;color:var(--brand);margin-top:2px}
.cstep p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.45}
@media (max-width:900px){ .cycle{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .cycle{grid-template-columns:1fr} }
/* Teaching */
.courses{display:grid;gap:0}
.course{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.course .code{font-family:var(--mono);font-size:13.5px;color:var(--brand)}
.course .term{font-size:13px;color:var(--muted);margin-top:4px}
.course h3{font-size:20px}
.course p{margin-top:8px;color:var(--muted);font-size:15px;}
@media (max-width:600px){ .course{grid-template-columns:1fr;gap:6px} }
.course .outline-btn{margin-top:14px}
.course .outline-btn .car{font-size:11px;margin-left:2px}
table.outline{width:100%;border-collapse:collapse;margin-top:14px;font-size:14.5px}
table.outline th{width:84px;text-align:left;font-family:var(--mono);font-weight:500;font-size:12.5px;letter-spacing:.04em;color:var(--brand);padding:7px 10px 7px 0;border-top:1px solid var(--line);vertical-align:top;white-space:nowrap}
table.outline td{padding:7px 0;border-top:1px solid var(--line);color:var(--fg);line-height:1.45}

/* Join */
.values{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 36px;margin-top:8px}
.value{border-top:1px solid var(--line);padding-top:14px}
.value h3{font-size:17px}
.value p{margin-top:6px;color:var(--muted);font-size:14.5px}
.apply{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-top:20px}
.apply .box{border:1px solid var(--line-strong);border-radius:var(--radius);padding:18px;background:var(--surface)}
.apply .box h4{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.apply .box .v{margin-top:8px;font-size:15px}
.apply .box code{font-family:var(--mono);font-size:14px;background:var(--soft);padding:2px 6px;border-radius:3px}
.copy-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.copy-row .addr{font-family:var(--mono);font-size:15px;user-select:all}
.dislist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dislist span{font-size:13.5px;padding:5px 10px;border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.ko{font-size:14px;color:var(--muted);margin-top:16px}

footer{border-top:1px solid var(--line);margin-top:40px;background:#F4F4F4}

 "research": {
  "core": {
   "eyebrow": "GEHL's vision and methods",
   "title": "A reliable, realistic, and interactive seismic risk map",
   "paragraphs": [
    "GEHL's vision is a seismic risk map that is reliable, realistic, and interactive: one that engineers, planners, and the public can trust and use. Every project in the lab is a step toward it, and every project follows one chain: characterize the input motion, identify the soil-foundation-structure system, and predict its output. The same framework is being extended from earthquakes to other natural hazards.",
    "Reaching that map takes methods at every scale, from the laboratory to the city. Laboratory and centrifuge tests expose the micro-mechanics of soil at the particle scale; centrifuge and numerical modeling capture the response of single and multiple structures as one system; and site characterization, from shear-wave velocity profiles to earthquake case histories and drone-based surveys, builds the liquefaction hazard and ground-motion models behind the map. Experimental, numerical, and analytical results are checked against recorded earthquakes from databases such as DesignSafe, KiK-net, and CESMD, and probabilistic methods carry the uncertainty through to the final risk estimate."
   ],
   "framework": [
    {
     "k": "Input",
     "t": "Input motion",
     "s": "Ground-motion characterization, seismic source and fault modeling, site response"
    },
    {
     "k": "System",
     "t": "System identification",
     "s": "Soil, foundation, and structure as one dynamic system: centrifuge tests, element tests, numerical models"
    },
    {
     "k": "Output",
     "t": "Output prediction",
     "s": "Settlement, rotation, pore pressure, cracking, and erosion, with their uncertainty"
    }
   ],
   "loop": "Validated against earthquake case histories and fed back into design",

   "figure": "img/vision-methods.jpg",
   "figureCaption": "Methods for GEHL's vision, from laboratory to urban scale: laboratory tests and centrifuge modeling for micro-mechanics, centrifuge and numerical modeling for system-level response, and site characterization for seismic hazard and risk maps."
  },
  "areas": [
   {
    "id": "ssi",
    "eyebrow": "Research area 1 | Soil-structure interaction",
    "title": "Dynamic Soil-Foundation-Structure Interaction",
    "paragraphs": [
     "Seismic design usually treats the structure and the ground separately. We measure how they move together, so that the interaction can be used in design rather than ignored. Dynamic centrifuge tests on shallow foundations, rocking foundations, and disconnected piled rafts give the data; analytical models that couple horizontal structural response with foundation rocking and swaying turn the data into predictions.",
     "Rocking shallow foundations are a good example: rocking reduces the demand on the superstructure but leaves permanent deformation, so the question is how to use it safely. Short piles, the soil-rounding effect, cyclic versus dynamic rocking, and ground-motion intensity measures for rocking performance all come from this line of work."
    ],
    "topics": [
     "Structural inertial interaction",
     "Period-lengthening ratio of SDOF structures",
     "Structure-to-foundation mass ratio",
     "Rocking shallow foundations and short piles",
     "Disconnected piled raft (DPR)",
     "Modular buildings on pile foundations"
    ],

   {
    "id": "liquefaction",
    "eyebrow": "Research area 2 | Soil liquefaction",
    "title": "Energy-Based Soil Liquefaction Assessment",
    "paragraphs": [
     "We use the energy dissipated in the soil, rather than cyclic stress alone, to estimate the buildup of excess pore pressure. This makes it possible to evaluate liquefaction without pore-water-pressure transducers, to read the timing of liquefaction directly from recorded ground motions through the spectral energy ratio, and to treat dissipated energy as an index of liquefiability.",
     "The framework has been validated against case histories such as the 2003 Tokachi-Oki earthquake at the Port of Kushiro and the 2017 Pohang earthquake, and extended into a probabilistic energy-based framework that connects triggering to consequences such as settlement. Ongoing work builds a multi-scale framework for integrated cyclic loadings and a probabilistic liquefaction hazard assessment for the Pohang region."
    ],
    "topics": [
     "Energy-based triggering evaluation",

   {
    "id": "dams",
    "eyebrow": "Research area 3 | Dams and levees",
    "title": "Cracking and Concentrated Leak Erosion due to Fault Rupture",
    "paragraphs": [
     "Many embankment dams sit on or near active faults. A vertical offset in the foundation can crack the crest, and water flowing through that crack can erode the core. We estimate crack dimensions from the offset and judge the erosion potential from the erodibility and swelling of the core material.",
     "Triaxial, swell, erosion, and beam-bending tests characterize the soil; centrifuge tests with controlled foundation offsets, run in collaboration with UC Davis, Auburn University, and the California Department of Water Resources, show how cracks propagate and how fast water moves through them; numerical models carry the mechanism to prototype scale."
    ],

   {
    "id": "site",
    "eyebrow": "Research area 4 | Site response and ground motion",
    "title": "Seismic Site Response, Topographic Effects, and Ground Motion",
    "paragraphs": [
     "The motion that reaches a foundation depends on the source, the path, and the site. We work on seismic source and fault modeling, ground-motion characterization for Korean and global conditions, and one- and two-dimensional site response analysis, including the amplification caused by topography.",
     "Dynamic centrifuge tests of slopes and ridges quantify topographic effect parameters on site amplification, and geophysical investigation (for example MASW) ties the models to real sites. The results feed national seismic design scenarios for mountainous terrain."

 "teachingPhilosophy": "New research and new technology keep expanding what is known, so a teacher has to keep learning and recognize quickly which new developments matter. That takes a firm grip on the fundamentals. The aim in every course is to close the gap between established and new research, to connect fundamental theory with practice, and to help students become self-directed engineers who can solve problems that did not exist when they were students.",
 "culture": {
  "lead": "Research begins where something does not work. We go after unsolved problems and trace them back to fundamentals, with the freedom of structured autonomy: flexible but clear guidelines, self-directed growth, and teamwork.",
  "lookingFor": [
   {
    "title": "Teamwork",
    "text": "We share data, code, failures, and credit. Progress in a centrifuge lab is a team result."
   },
   {
    "title": "A mechanics-oriented mindset",
    "text": "Tools change; equilibrium, compatibility, and constitutive behavior do not. We want people who reason from mechanics first."
   },
   {
    "title": "Logical communication",
    "text": "A clear argument, in a figure or a paragraph, is as much a research skill as a good test."
   },
   {
    "title": "Persistence and resilience",
    "text": "Tests fail, models diverge, and reviewers push back. Keep going, and learn from what broke."
   },
   {
    "title": "Clear storytelling",
    "text": "Research has to be explained to colleagues, practitioners, and the public."
   },
   {
    "title": "Self-motivation",
    "text": "Curiosity and a sense of engineering responsibility carry a project further than any schedule."
   }
  ],

    var html = pageBand('news', 'News and Gallery') + '<div class="wrap">' +
      '<div class="tabs" role="tablist">' + er.list.map(function (e) { return '<button role="tab" data-era="' + attr(e) + '" aria-selected="' + (newsState.era === e) + '">' + (e === 'before' ? 'Before KAIST (2021–2025)' : esc(e)) + ' <span class="muted">(' + er.counts[e] + ')</span></button>'; }).join('') + '</div>' +
      '<div class="filters"><button data-nk="all" aria-pressed="' + (newsState.kind === 'all') + '">All</button>' + Object.keys(kinds).map(function (k) { return '<button data-nk="' + attr(k) + '" aria-pressed="' + (newsState.kind === k) + '">' + kindTag(k) + ' (' + kinds[k] + ')</button>'; }).join('') + '</div>';
    html += shown.length ? '<div class="news-grid">' + shown.map(newsCard).join('') + '</div>' : '<div class="empty">Nothing here yet.</div>';
    return html + '</div>';
  }

  function viewJoin() {
    var C = DATA.culture, L = DATA.lab, ap = C.apply || {};
    var html = pageBand('join', 'Join Us') + '<div class="wrap">';
    if (C.lead) html += '<p class="lede">' + esc(C.lead) + '</p>';
    html += '<section class="section"><div class="section-head"><h2>Who we are looking for</h2></div><div class="values">' + (C.lookingFor || []).map(function (v) { return '<div class="value"><h3>' + esc(v.title) + '</h3><p>' + esc(v.text) + '</p></div>'; }).join('') + '</div>';
    if (C.discourage && C.discourage.length) html += '<div class="eyebrow" style="margin-top:30px">What we discourage</div><div class="dislist">' + C.discourage.map(function (d) { return '<span>' + esc(d) + '</span>'; }).join('') + '</div>';
    html += '</section>';
    html += '<section class="section"><div class="section-head"><h2>Open positions</h2></div><p class="prose">' + esc(C.positions || '') + '</p>' +
      (C.goalsKo && C.goalsKo.length ? '<p class="ko">연구 목표: ' + C.goalsKo.map(esc).join(' · ') + '</p>' : '') + '</section>';
    html += '<section class="section"><div class="section-head"><h2>How to apply</h2></div><p class="prose">Email Prof. Kil-Wan Ko. One message with the items below is enough; there is no separate application form.</p>' +
      '<div class="apply">' +
      '<div class="box"><h4>Email</h4><div class="copy-row"><span class="addr">' + esc(L.email) + '</span></div></div>' +
      '<div class="box"><h4>Subject line</h4><div class="v"><code>' + esc(ap.subject) + '</code></div></div>' +
      '<div class="box"><h4>Contents</h4><div class="v">' + esc(ap.contents) + '</div></div>' +
      '<div class="box"><h4>Attachments</h4><div class="v">' + esc(ap.attachments) + '</div></div>' +
      '</div><p class="muted" style="margin-top:18px;font-size:14px">' + textLines(L.meetings) + '</p></section>';
    return html + '</div>';
  }

  function renderFooter() {
    var L = DATA.lab;
    document.getElementById('footer').innerHTML =
      '<div><h4>' + esc(L.short) + ' · ' + esc(L.name) + '</h4><div>' + esc(L.department) + '<br><span class="addr">' + esc(L.address) + (L.mapUrl ? '<a href="' + attr(L.mapUrl) + '" target="_blank" rel="noopener">Map ↗</a>' : '') + '</span></div>' +
      '<div class="small">' + esc(L.copyright || '© Copyright ' + new Date().getFullYear() + '. ' + L.name + ' All Rights Reserved.') + '</div></div>' +
      '<div class="contact"><h4>Contact</h4><ul><li><span class="mono">' + esc(L.email) + '</span></li></ul>' +
      '<div class="small meet">' + textLines(L.meetings) + '</div></div>' +
      '';
  }

  // ---------- router ----------
  var VIEWS = { home: viewHome, research: viewResearch, people: viewPeople, publications: viewPublications, teaching: viewTeaching, news: viewNews, join: viewJoin, blossoms: viewBlossoms };
  var currentView = 'home';
  function routeFromHash() {
    var h = (location.hash || '#home').slice(1);
    if (/^person-/.test(h)) return { view: 'people', person: h.slice(7) };
    if (/^news-/.test(h)) { var v = h.slice(5); if (/^\d{4}$/.test(v) || v === 'before') { newsState.era = v; newsState.kind = 'all'; return { view: 'news' }; } return { view: 'news', news: v }; }
    if (h === 'projects') return { view: 'research', scrollTo: 'projects' };
    if (PUB_TYPES.some(function (t) { return t[0] === h; })) { pubState.type = h; pubState.year = 'all'; return { view: 'publications' }; }
    return { view: VIEWS[h] ? h : 'home' };
  }
  var NAV_PARENT = { blossoms: 'home' };
  function render(opts) {
    opts = opts || {};
    var r = routeFromHash(); currentView = r.view;
    var app = document.getElementById('app');
    app.innerHTML = VIEWS[currentView]();
    document.querySelectorAll('nav.main a[data-nav]').forEach(function (a) { if (a.dataset.nav === (NAV_PARENT[currentView] || currentView)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    document.getElementById('main-nav').classList.remove('open');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
    renderFooter();
    fitTitle(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
    if (r.person) openPerson(r.person); else if (!opts.keepModal && !r.news) closeModal();
    if (r.news) { var t = document.getElementById('news-' + r.news); if (t && !opts.keepScroll) t.scrollIntoView({ block: 'center' }); openNews(r.news); }
    else if (r.scrollTo) { var sec = document.getElementById(r.scrollTo); if (sec) { var top = sec.getBoundingClientRect().top + window.scrollY - 76; window.scrollTo(0, top); } }
    else if (!opts.keepScroll) window.scrollTo(0, 0);
    var q = document.getElementById('pub-q'); if (q && opts.focusSearch) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  window.addEventListener('hashchange', function () { render(); });

  // ---------- events (delegated) ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-person],[data-pf],[data-af],[data-pt],[data-py],[data-era],[data-nk],[data-copy],[data-close],[data-news],[data-car],[data-carto],[data-outline],#menu-btn');
    if (!t) { if (e.target.classList && e.target.classList.contains('modal')) closeModal(); return; }
    if (t.id === 'menu-btn') { var nav = document.getElementById('main-nav'); var open = nav.classList.toggle('open'); t.setAttribute('aria-expanded', String(open)); return; }
    if (t.dataset.person) { e.preventDefault(); openPerson(t.dataset.person); return; }
    if (t.hasAttribute('data-close')) { closeModal(); return; }
    if (t.dataset.pf) { peopleFilter = t.dataset.pf; render({ keepScroll: true }); return; }
    if (t.dataset.af) { alumniFilter = t.dataset.af; render({ keepScroll: true }); return; }
    if (t.dataset.pt) {   // a #journal-style hash would pin the type again on render, so drop it first
      if (PUB_TYPES.some(function (x) { return '#' + x[0] === location.hash; })) history.replaceState(null, '', '#publications');
      pubState.type = t.dataset.pt; pubState.year = 'all'; render({ keepScroll: true }); return;
    }
    if (t.dataset.py) { pubState.year = t.dataset.py; render({ keepScroll: true }); return; }
    if (t.dataset.era) { newsState.era = t.dataset.era; newsState.kind = 'all'; render({ keepScroll: true }); return; }
    if (t.dataset.nk) { newsState.kind = t.dataset.nk; render({ keepScroll: true }); return; }
    if (t.dataset.outline != null) { openOutlines[t.dataset.outline] = !openOutlines[t.dataset.outline]; render({ keepScroll: true }); return; }
    if (t.dataset.car) { stepNews(parseInt(t.dataset.car, 10)); return; }
    if (t.dataset.carto != null) { stepNews(0, parseInt(t.dataset.carto, 10)); return; }
    if (t.dataset.news) {
      e.preventDefault(); var id = t.dataset.news, n = DATA.news.filter(function (x) { return x.id === id; })[0];
      if (currentView === 'news') { openNews(id); return; }   // already on the page: just open the popup
      if (n) { newsState.era = n.era === 'before' ? 'before' : (n.date || '').slice(0, 4); newsState.kind = 'all'; }
      location.hash = '#news-' + id; if (location.hash === '#news-' + id) render(); return;
    }
    if (t.dataset.copy != null) {
      var text = t.dataset.copy, done = function () { toast('Copied: ' + text); };
      try { navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); }); } catch (err) { fallbackCopy(text); done(); }
    }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'pub-q') { pubState.q = e.target.value; render({ keepScroll: true, focusSearch: true }); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (document.getElementById('person-modal') || document.getElementById('news-modal')) closeModal(); return; }
    if (document.getElementById('news-modal')) { if (e.key === 'ArrowLeft') stepNews(-1); else if (e.key === 'ArrowRight') stepNews(1); }
  });
  function fallbackCopy(text) { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } document.body.removeChild(ta); }
  var toastTimer;
  function toast(msg, ms) { var r = document.getElementById('toast-root'); r.innerHTML = '<div class="toast" role="status">' + esc(msg) + '</div>'; clearTimeout(toastTimer); toastTimer = setTimeout(function () { r.innerHTML = ''; }, ms || 2600); }

  // Size every page title so the lab name would exactly fill the column on one line.
  function fitTitle() {
    var wrap = document.querySelector('.pband .wrap'); if (!wrap) return;
    var cs = getComputedStyle(wrap), box = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); if (!(box > 0)) return;
    var probe = document.createElement('span'); probe.textContent = DATA.lab.name || 'GEHL';
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:' + cs.fontFamily + ';font-weight:700;font-size:100px;letter-spacing:-.012em';
    document.body.appendChild(probe); var w = probe.getBoundingClientRect().width; document.body.removeChild(probe);
    if (!w) return;
    var size = Math.floor(100 * box / w * 100) / 100;
    document.documentElement.style.setProperty('--title-size', (size >= 26 ? size : 0) + 'px');
    document.documentElement.classList.toggle('title-fit', size >= 26);
  }
  var rT; window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(fitTitle, 100); });

  // ---------- boot ----------
  render();
  try { var msg = sessionStorage.getItem('gehl-toast'); if (msg) { sessionStorage.removeItem('gehl-toast'); toast(msg, 4000); } } catch (e) { }

  window.GEHL = { pubTypes: PUB_TYPES, pageKeys: PAGE_KEYS, data: DATA, render: render, toast: toast, esc: esc, parseAuthors: parseAuthors, matchMembers: matchMembers, autoAlias: autoAlias, rebuildIndex: buildMemberIndex, groups: GROUPS, kinds: KINDS, kindEmoji: kindEmoji, avatarSrc: avatarSrc, fmtDate: fmtDate, safeUrl: safeUrl, personById: personById, currentView: function () { return currentView; }, nearProjects: function () { var el = document.getElementById('projects'); return !!el && el.getBoundingClientRect().top < window.innerHeight * 0.5; } };
})();
</script>
